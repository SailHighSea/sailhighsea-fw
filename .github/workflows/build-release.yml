name: Build and Release SailHighSea Firewall

# One release per version, containing the native C build:
#   - SailHighSea-Firewall-native-<ver>-win-x64.exe / .zip
# (The .NET build is not released for now; its source is still in the repo.)
#
# main -> stable release   (v0.0.1, v0.0.2, ...)
# dev  -> pre-release      (v0.0.1-dev.1, v0.0.1-dev.2, ...), marked "Pre-release" and never "Latest"
on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

# Never run two releases at once (they would both try to create the same tag).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      base: ${{ steps.v.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to see the existing tags
      - name: Work out the version
        id: v
        run: |
          # Next patch number after the latest *stable* tag (vX.Y.Z; dev/native tags are ignored).
          stable=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -z "$stable" ]; then
            next="0.0.1"
          else
            IFS=. read -r ma mi pa <<<"${stable#v}"
            next="$ma.$mi.$((pa + 1))"
          fi
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            version="$next"
          else
            # dev builds count up from 1 for each base version: v0.0.1-dev.1, v0.0.1-dev.2, ...
            last=$(git tag --list "v$next-dev.*" | sed 's/.*-dev\.//' | sort -n | tail -n1 || true)
            version="$next-dev.$(( ${last:-0} + 1 ))"
          fi
          echo "Latest stable tag: '$stable' -> building $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=$next" >> "$GITHUB_OUTPUT"

  build-native:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build (native C)
        working-directory: native
        run: |
          sed -i 's/\r$//' build.sh
          bash build.sh "${{ needs.version.outputs.base }}" "${{ needs.version.outputs.version }}"
      - name: Package (native C)
        run: |
          v="${{ needs.version.outputs.version }}"
          mkdir out
          cp native/SailHighSea-Firewall.exe "out/SailHighSea-Firewall-native-$v-win-x64.exe"
          (cd out && zip "SailHighSea-Firewall-native-$v-win-x64.zip" "SailHighSea-Firewall-native-$v-win-x64.exe")
      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: out/*

  release:
    needs: [version, build-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create Tag, Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SailHighSea Firewall v${{ needs.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' }}
          files: assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
